# Autotune search space for grokking_optimizers.compile.
#
# One top-level key per arch. Each arch carries:
#   dims:       list of tunable dimensions (name, type, values, macro, applies_to)
#   prefilter:  static pruning rules applied to the cartesian product
#               BEFORE any compile is attempted
#
# Edit values to expand / contract the search space. The number of
# configs after pre-filtering is logged at the start of every autotune
# run.

# ─── NVIDIA Hopper (H100/H200) ──────────────────────────────────────────────
sm_90:
  dims:
    - name: block
      type: int
      values: [64, 128, 256, 512, 1024]
      macro: SG_TUNED_BLOCK_SIZE
      applies_to: [host, device]
    - name: vec
      type: int
      values: [1, 2, 4]
      macro: SG_TUNED_VEC_WIDTH
      applies_to: [host, device]
    - name: unroll
      type: int
      values: [1, 2, 4, 8, 16]
      macro: SG_TUNED_UNROLL
      applies_to: [host, device]
    - name: num_stages
      type: int
      values: [2, 3, 4, 5]
      macro: SG_TUNED_NUM_STAGES
      applies_to: [device]
    - name: maxrregcount
      type: int
      values: [128, 168, 200, 232, 255]
      macro: null              # not a #define — promoted to NVCC flag
      applies_to: [device]
    - name: cluster_shape
      type: tuple
      values:
        - [1, 1, 1]
        - [2, 1, 1]
        - [2, 2, 1]
      macro: SG_TUNED_CLUSTER_SHAPE
      applies_to: [device]
    - name: swizzle
      type: enum
      values: [none, xor4, xor8]
      macro: SG_TUNED_SWIZZLE
      applies_to: [device]
    - name: warp_specialization
      type: bool
      values: [false, true]
      macro: SG_TUNED_WARP_SPECIALIZATION
      applies_to: [device]
    - name: tma
      type: bool
      values: [false, true]
      macro: SG_TUNED_TMA
      applies_to: [device]
    - name: async_depth
      type: int
      values: [1, 2, 4, 8]
      macro: SG_TUNED_ASYNC_DEPTH
      applies_to: [device]
  prefilter:
    register_pressure_max: 255
    smem_budget_bytes: 232448      # 227 KB usable smem per SM on Hopper
    rules:
      # ≤32 warps per block on Hopper
      - name: warps_per_block
        expr: "(block // 32) <= 32"
      # vec * 4 bytes must divide block (alignment for vec loads)
      - name: vec_block_alignment
        expr: "block % (vec * 4) == 0"
      # Pipelined kernels need block large enough to hide stage latency
      - name: stages_block
        expr: "num_stages * vec <= block // 32"
      # TMA + warp specialization need block >= 128 (one warp dedicated)
      - name: tma_requires_block
        expr: "(not tma) or block >= 128"
      - name: warpspec_requires_block
        expr: "(not warp_specialization) or block >= 128"
      # Cluster volume cap: max 8 CTAs per cluster (Hopper hardware limit)
      - name: cluster_volume
        expr: "cluster_shape[0] * cluster_shape[1] * cluster_shape[2] <= 8"
      # Async depth ≥ num_stages (need enough barriers)
      - name: async_depth_stages
        expr: "async_depth >= num_stages - 1"

# ─── AMD CDNA3 (MI300X/MI300A) ──────────────────────────────────────────────
gfx942:
  dims:
    - name: block
      type: int
      values: [64, 128, 256, 512, 1024]
      macro: SG_TUNED_BLOCK_SIZE
      applies_to: [host, device]
    - name: vec
      type: int
      values: [1, 2, 4]
      macro: SG_TUNED_VEC_WIDTH
      applies_to: [host, device]
    - name: unroll
      type: int
      values: [1, 2, 4, 8, 16]
      macro: SG_TUNED_UNROLL
      applies_to: [host, device]
    - name: num_stages
      type: int
      values: [1, 2, 3]
      macro: SG_TUNED_NUM_STAGES
      applies_to: [device]
    - name: maxrregcount
      type: int
      values: [128, 160, 192, 224, 256]
      macro: null
      applies_to: [device]
    - name: waves_per_eu
      type: int
      values: [1, 2, 4, 8, 10]
      macro: SG_TUNED_WAVES_PER_EU
      applies_to: [device]
    - name: lds_padding
      type: int
      values: [0, 1, 2, 4]
      macro: SG_TUNED_LDS_PADDING
      applies_to: [device]
    - name: mfma_shape
      type: enum
      values: [m16n16k16, m32n32k8, m16n16k32, m32n32k16]
      macro: SG_TUNED_MFMA_SHAPE
      applies_to: [device]
    - name: scheduler_hint
      type: enum
      values: [default, llvm, iglp_max_throughput]
      macro: SG_TUNED_SCHEDULER_HINT
      applies_to: [device]
  prefilter:
    register_pressure_max: 256
    waves_per_eu_max: 10
    smem_budget_bytes: 65536       # 64 KB LDS per CU
    rules:
      # Wavefront on CDNA3 is 64 → block must be a multiple of 64
      - name: wave_alignment
        expr: "block % 64 == 0"
      # ≤16 waves per block (1024 threads / 64 lanes)
      - name: waves_per_block
        expr: "(block // 64) <= 16"
      # waves_per_eu × waves_per_block ≤ 10 (per-EU occupancy ceiling)
      - name: waves_per_eu_total
        expr: "waves_per_eu * (block // 64) <= 20"
      # vec × 4 bytes divides block
      - name: vec_block_alignment
        expr: "block % (vec * 4) == 0"
      # MFMA shape requires block large enough to fill at least one tile
      - name: mfma_block_min
        expr: "block >= 64"

# ─── TPU v5p (handled via JAX/Pallas; no C++ space) ─────────────────────────
tpu_v5p:
  dims: []
  prefilter:
    rules: []
