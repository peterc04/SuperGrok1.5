# Ruff config for grokking_optimizers.
#
# The codebase has ~150 pre-existing F401 (unused imports) and F841 (unused
# locals) across the optimizer + TPU kernel files. Many of those are
# intentional (typed-shape comments in scientific code; documentation of
# bound variables that the compiler-emitted kernel reads). Rather than mass-
# rewrite that history, we scope the lint to rules that catch real bugs and
# accept the noise rules as documentation-only.
#
# When the baseline gets cleaned up, drop the corresponding ignore here.

line-length = 100
target-version = "py310"

extend-exclude = [
    "build",
    "third_party",
    "csrc",
    "autotune",
]

[lint]
# Enable the rule families that catch real bugs:
#   E/W   — pycodestyle errors / warnings
#   F     — pyflakes (logic bugs, but we mute the noisy unused-var subset)
#   B     — flake8-bugbear (common Python footguns)
#   PLE   — pylint errors (syntax + clear bugs only)
select = ["E", "W", "F", "B", "PLE"]

ignore = [
    # ─── Noise rules — baseline cleanup, not bugs ────────────────────────
    "F401",  # unused import (TPU kernels intentionally pre-import for
             # template substitution; optimizer files declare Tensor/Iterable
             # for type-comment documentation)
    "F841",  # unused local variable (scientific code uses these as
             # shape/dim documentation; rewriting requires per-site review)
    "F811",  # redefinition of unused name (test functions in compile.py
             # repeatedly shadow `tempfile`/`shutil` in different scopes)
    # ─── Style preferences — too noisy to enforce blanket ────────────────
    "E501",  # line too long (compile.py has many long docstring URLs)
    "E402",  # module-level import not at top of file (compile.py
             # intentionally defers heavy imports until after probes run)
    "E731",  # lambda assignment (lambdas are intentional in search-space code)
    "E741",  # ambiguous variable name `l`/`I`/`O` (numerical code uses
             # single-letter names by convention — N, K, B, T, D, etc.)
    "B008",  # function call in default arg (used by some dataclass
             # factories; field(default_factory=) is preferred but not
             # universally applied yet)
    "B007",  # loop control variable not used in body (often intentional —
             # enumerating purely for the index or count)
    "B028",  # No explicit `stacklevel` in warnings.warn (too pedantic for
             # internal warnings)
    "B904",  # raise from inside except clause (we deliberately mask some
             # noisy library exceptions)
    "B905",  # zip() without explicit strict= (baseline pattern across the
             # codebase; safe to fix incrementally — requires per-site review
             # to confirm length-equality before flipping to strict=True)
    "B023",  # function does not bind loop variable (loop-late-binding bug
             # in 2 known sites; documented as baseline noise pending
             # follow-up audit)
]

[lint.per-file-ignores]
# Test code blocks inside compile.py shadow imports and define helpers that
# look unused to ruff but are exec'd via the self-test harness.
"grokking_optimizers/compile.py" = ["E712", "E721"]

[format]
# Match the existing code style — 4-space indent, double quotes, trailing
# commas in multi-line collections.
quote-style = "double"
indent-style = "space"
