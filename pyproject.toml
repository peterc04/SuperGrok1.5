[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "supergrok"
version = "0.1.0"
description = "Grokking-optimizer race: pure-PyTorch reference optimizers and a DeepSeek-V4.1-Flash model"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = ["torch>=2.4", "numpy", "matplotlib", "tqdm"]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/peterc04/SuperGrok1.5"

[tool.setuptools.packages.find]
include = ["grokking_optimizers*", "deepseek_v41*", "grokking_race*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer CPU runs (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/reference_deepseek"]  # the official DeepSeek code, kept verbatim

[tool.ruff.lint]
select = ["E", "W", "F", "B", "PLE", "I"]
ignore = ["E741", "E731", "B905"]
