name: CodeQL

# GitHub-native static analysis (SAST). Runs on push/PR to main and weekly.
# Python is analysed in the default (no-build) mode. C/C++ (the CUDA/HIP
# sources) is intentionally NOT analysed here because CodeQL's cpp extractor
# needs a real compile and this repo's csrc/ requires a CUDA/ROCm toolchain
# that GitHub-hosted runners lack — that path is covered by the cpp_structural
# job in ci.yml instead.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "27 3 * * 1"   # Mondays 03:27 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
